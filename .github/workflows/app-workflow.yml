name: Main project workflow

on:
  push:
    branches: main

jobs:
  first-job:
    name: First Job for Print
    runs-on: ubuntu-latest
    steps:
      - name: Printing step 1
        run: echo "Hello!!!"

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0' 
          cache: 'npm'

      - name: Install Dependency
        run: npm install

      - name: Unit testing
        run: node --test app.test.js

  Docker:
    name: Docker setup and push image
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Login to docker hub
        action: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # - name: Build Docker image
      #   action: 
          

