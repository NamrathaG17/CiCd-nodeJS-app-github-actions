name: Main project workflow

on:
  push

jobs:
  first-job:
    name: First Job for Print
    runs-on: ubuntu-latest
    steps:
      - name: Printing step 1
        run: echo "Hello!!!"
      - name: checkout-repo
        uses: actions/checkout@v7

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0' 
          cache: 'npm'

      - name: Install Dependency
        run: npm install

      - name: Unit testing
        run: node --test app.test.js

